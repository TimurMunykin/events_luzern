services:
  pocketbase:
    build:
      context: ./backend
      args:
        PB_VERSION: ${PB_VERSION:-0.35.0}
    restart: unless-stopped
    environment:
      REQUEST_NOTIFY_TO: ${REQUEST_NOTIFY_TO:-}
      APP_ENV: ${APP_ENV:-production}
      CHECKOUT_ENABLED: ${CHECKOUT_ENABLED:-false}
      CHECKOUT_ORIGIN: ${CHECKOUT_ORIGIN:-}
      CHECKOUT_NOTIFY_TO: ${CHECKOUT_NOTIFY_TO:-}
      STRIPE_MODE: ${STRIPE_MODE:-live}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - ./data/pocketbase:/pb/pb_data
      - ./prototypes:/pb/prototypes:ro
    expose:
      - "8090"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - pocketbase
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-:80}
      TICKET_PAGE_FILE: ${TICKET_PAGE_FILE:-ticket-v22h.html}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./login.html:/srv/site/login.html:ro
      - ./prototypes:/srv/site/prototypes:ro
      - ./admin:/srv/site/admin:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
