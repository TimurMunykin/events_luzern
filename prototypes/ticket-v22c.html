<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Ваш билет · Events.Luzern</title>
<link rel="icon" href="/assets/logo.png"><link rel="stylesheet" href="/assets/ticketing-v22c/ticket.css"></head>
<body><main class="ticket-sheet">
<header><a class="brand" href="/" aria-label="Events.Luzern"><img src="/assets/logo.png" alt="Events.Luzern" width="76" height="76"><span>Events.Luzern</span></a><span id="ticket-number"></span></header>
<p id="ticket-status" role="status">Загружаем билет…</p>
<section id="ticket-content" hidden><div class="event"><h1 id="event-name"></h1><p id="event-time"></p><p id="event-place"></p><a id="event-address" target="_blank" rel="noopener noreferrer"></a></div>
<div class="admission"><div><p id="guest-label" class="muted"></p><h2 id="guest-name"></h2><p id="ticket-help"></p><p id="admission-state" role="status"></p></div><img id="ticket-qr" width="240" height="240" alt="QR"></div>
<dl><div><dt id="entry-label"></dt><dd id="event-entry"></dd></div><div><dt id="bring-label"></dt><dd id="event-bring"></dd></div></dl>
<div class="ticket-actions"><a class="button primary" id="ticket-calendar"></a><button id="ticket-pdf" type="button"></button></div><p id="download-status" role="status"></p>
<footer><span id="contact-label"></span> <a href="mailto:info@events-luzern.ch">info@events-luzern.ch</a></footer>
</section></main><script src="/assets/ticketing-v22c/ticket.js"></script></body></html>
